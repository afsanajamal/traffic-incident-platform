services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: traffic_incidents
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic_incidents"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://traffic:traffic@postgres:5432/traffic_incidents
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  simulator:
    build:
      context: ./simulator
    environment:
      API_BASE_URL: http://api:8000
      INTERVAL_SECONDS: 5
      RUN_MODE: continuous
    depends_on:
      - api

volumes:
  postgres_data:
